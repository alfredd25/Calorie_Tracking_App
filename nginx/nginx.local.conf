events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Use Docker's embedded DNS so nginx re-resolves upstream hostnames
    # whenever a container restarts and gets a new IP. Combined with the
    # `set $upstream ...; proxy_pass http://$upstream;` pattern below this
    # avoids stale-IP 502s without needing to restart nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 10m;

    server {
        listen 80;

        # When proxy_pass uses a variable, nginx resolves it per-request
        # rather than caching the IP at startup like a static `upstream`
        # block does. We keep the existing path-stripping behaviour with an
        # explicit rewrite so the dev contract matches production exactly.
        location /api/ {
            set $backend_upstream "api:8000";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location / {
            set $frontend_upstream "frontend:3000";
            proxy_pass http://$frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
