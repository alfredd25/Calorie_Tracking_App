events {
    worker_connections 1024;
}

http {
    # Hide nginx version in error pages and the Server response header.
    server_tokens off;

    # Per-request DNS resolution against Docker's embedded resolver so
    # restarting any upstream container does not require an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Reasonable upload ceiling. Adjust if the backend accepts larger payloads.
    client_max_body_size 10m;

    # ─── Shared proxy header set ────────────────────────────────────────────
    # Defined once and included into both the /api/ and / blocks below.
    # Keeping it in a map-free snippet via `include` would also work, but a
    # plain repeated set keeps this file self-contained.

    # ─── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name nutritracks.tech www.nutritracks.tech;

        # Permanent redirect; safe to cache.
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS termination ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name nutritracks.tech www.nutritracks.tech;

        ssl_certificate     /etc/letsencrypt/live/nutritracks.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nutritracks.tech/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — only enable once you are confident every subdomain is HTTPS.
        # `preload` requires explicit submission to hstspreload.org.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Defense-in-depth headers. Forwarded to the browser; do NOT set on
        # proxy_set_header lines (those are for upstream requests).
        add_header X-Content-Type-Options "nosniff"        always;
        add_header X-Frame-Options        "SAMEORIGIN"     always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;

        # ─── Backend API ────────────────────────────────────────────────────
        # Browser hits https://nutritracks.tech/api/auth/login
        # Nginx strips the leading /api and proxies to http://api:8000/auth/login
        location /api/ {
            set $backend_upstream "api:8000";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Preserve client + scheme info so FastAPI/uvicorn can build correct
            # absolute URLs and honor secure-cookie semantics. Requires uvicorn
            # to be started with --proxy-headers (or equivalent middleware).
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # Keep Authorization and Cookie headers explicitly. Nginx forwards
            # them by default, but listing them documents intent and guards
            # against future `proxy_set_header Authorization ""` mistakes.
            proxy_pass_request_headers on;

            # Timeouts tuned for typical FastAPI workloads. Bump for long-poll.
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ─── Next.js frontend ───────────────────────────────────────────────
        location / {
            set $frontend_upstream "frontend:3000";
            proxy_pass http://$frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }
    }
}
